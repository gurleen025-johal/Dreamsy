
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreamsy 💜</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#51476e;background:linear-gradient(135deg,#f1eaff,#e4f4ff,#fff0f7);min-height:100vh}
header{text-align:center;padding:24px;background:#ffffffaa}
h1{color:#987be0;font-size:38px;margin:8px}
main{max-width:1000px;margin:auto;padding:24px 12px;text-align:center}
input{width:90%;max-width:450px;padding:14px;border:1px solid #d9cafa;border-radius:25px;font-size:16px}
button{margin:5px;padding:10px 15px;border:0;border-radius:20px;background:#e4d9ff;color:#51476e;cursor:pointer}
button.active{background:#bba4f3;color:white}
.gallery{columns:3 200px;column-gap:12px;margin-top:22px}
.card{break-inside:avoid;margin-bottom:14px;padding:22px 10px;border-radius:20px;background:white;box-shadow:0 4px 15px #b9a6d833}
.art{font-size:55px;padding:25px 0;background:linear-gradient(135deg,#eadfff,#dff3ff,#ffe6f2);border-radius:15px}
.card h3{margin-bottom:5px}
.card p{font-size:13px}
footer{text-align:center;padding:25px}
@media(max-width:450px){.gallery{columns:2 130px}}
</style>
</head>
<body>
<header>
<h1>☁️ Dreamsy 🦋</h1>
<div>D R E A M • D I S C O V E R • S H A R E</div>
</header>
<main>
<h2>Welcome to your dreamy world ✨</h2>
<p>Collect pretty little moments and discover new moods. 🎀</p>
<input id="search" placeholder="🔎 Search your next little dream...">
<div id="filters"></div>
<div class="gallery" id="gallery"></div>
<p id="empty" hidden>No dreams found. Try another search! 🌷</p>
<div style="background:white;padding:20px;margin:20px auto;border-radius:20px;max-width:450px">
  <h2>🔐 Dreamsy Owner Login</h2>
  <input id="ownerEmail" type="email" placeholder="Your email">
  <input id="ownerPassword" type="password" placeholder="Your password">
  <button onclick="ownerSignUp()">Create Owner Account</button>
  <button onclick="ownerLogin()">Log In</button>
  <button onclick="ownerLogout()">Log Out</button>
  <hr>
  <h2>☁️ Share Your Dream</h2>
  <input id="picTitle" type="text" placeholder="Picture title">
  <input id="picCategory" type="text" placeholder="Category">
  <input id="picFile" type="file" accept="image/*">
  <button onclick="uploadDream()">⬆️ Upload Picture</button>
  <p id="uploadStatus"></p>
</div>
</main>
<footer>Made with 💜 and a little bit of magic ✨</footer>
<script>

const dreams=[
["Lavender Dreams","Aesthetic","https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=700&q=80","Soft colours, peaceful thoughts."],
["Moonlight Magic","Wallpapers","https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=700&q=80","Dream beneath the stars."],
["Creative Corner","Art","https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=700&q=80","Your imagination matters."],
["Study Sparkle","Study Inspiration","https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=700&q=80","One page at a time."],
["Butterfly Wishes","Cute Pictures","https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=700&q=80","Let your dreams fly."],
["Little Blossoms","Nature","https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80","Grow at your own pace."],
["Anime Daydream","Anime","https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=700&q=80","A world of imagination."],
["Gentle Reminder","Quotes","https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=700&q=80","Small steps still count."]
];

const cats=["All","Aesthetic","Art","Study Inspiration","Wallpapers","Cute Pictures","Nature","Anime","Quotes"];
let active="All";
const filters=document.getElementById("filters");
cats.forEach(c=>{
 const b=document.createElement("button");
 b.textContent=c;
 if(c===active)b.className="active";
 b.onclick=()=>{active=c;[...filters.children].forEach(x=>x.className=x.textContent===c?"active":"");render()};
 filters.appendChild(b);
});
 function openDream(index) {
  const d = dreams[index];
  if (!d) return;

  const old = document.getElementById("dream-modal");
  if (old) old.remove();

  const modal = document.createElement("div");
  modal.id = "dream-modal";
  modal.style.cssText =
    "position:fixed;inset:0;background:#171329dd;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto";

  modal.innerHTML = `
    <div style="background:#fff7ff;color:#332544;padding:20px;border-radius:20px;max-width:420px;width:100%;text-align:center">
      <button id="dream-close" style="float:right;font-size:20px">✖</button>
      <img src="${d[2]}" alt="${d[0]}" style="width:100%;max-height:300px;object-fit:contain;border-radius:14px">
      <h2>${d[0]}</h2>
      <p>${d[3]}</p>
      <p>Category: ${d[1]}</p>
      <a href="${d[2]}" download style="display:inline-block;background:#b69bdf;color:#fff;padding:12px 20px;border-radius:12px;text-decoration:none">⬇️ Download Picture</a>
    </div>`;

  document.body.appendChild(modal);

  document.getElementById("dream-close").onclick =
    () => modal.remove();

    modal.onclick = e => {
    if (e.target === modal) modal.remove();
  };
}
window.openDream = openDream;
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const shown=dreams.filter(d=>(active==="All"||d[1]===active)&&d.join(" ").toLowerCase().includes(q));
 

document.getElementById("gallery").innerHTML=shown.map(d=>`<article class="card" onclick="openDream(${dreams.indexOf(d)})" style="cursor:pointer"><img src="${d[2]}" alt="${d[0]}" style="width:100%;height:180px;object-fit:cover;border-radius:15px"><h3>${d[0]}</h3><p>${d[3]}</p><small>${d[1]}</small></article>`).join("");

 document.getElementById("empty").hidden=shown.length>0;
}
document.getElementById("search").addEventListener("input",render);
render();
</script>

  );

  window.dreamsySupabase = supabase;

  console.log('Dreamsy connected!');
</script>
</body>
</html>
